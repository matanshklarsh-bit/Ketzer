<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דוח איתור קצר</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="דוח איתור"><meta name="theme-color" content="#ffffff">
<style>
/*
VOICE: field tool, calm and fast; big targets for gloved fingers in the sun.
IDEA: the Ha-Meater report sheet itself — a form that becomes the printed page.
PICTURE: the working form; the A4 report preview is the payoff.
COLOUR/TYPE: white + ink black, logo accents (yellow, green, orange, red, blue); Assistant.
LAYOUT: one column, collapsible sections, sticky bottom action bar.
*/
:root{color-scheme:light;--bg:#f4f4f1;--card:#fff;--ink:#121212;--mut:#6b6b6b;--line:#dcdcd6;--acc:#1f6fb5;--y:#f2c200;--g:#1a9c4a;--o:#f39a1e;--r:#d6262e;--b:#1f6fb5}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Assistant,Arial,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px}
.top img{height:34px}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.ib{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
main{max-width:720px;margin:0 auto;padding:14px 12px 120px}
.big{width:100%;min-height:58px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:19px;font-weight:700;margin:6px 0 18px}
.rep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.rep .t{flex:1}.rep b{display:block}.rep small{color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
details.sec>summary{list-style:none;padding:14px 16px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
details.sec>summary::after{content:"▾";margin-inline-start:auto;color:var(--mut)}
details.sec[open]>summary::after{content:"▴"}
.body{padding:0 16px 16px}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 5px;color:#333}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;font-size:16px}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #9cc3ea;outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:42px;padding:6px 14px;border:1.5px solid var(--line);border-radius:22px;background:#fff;font-weight:600;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.sub{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:12px 0;background:#fafaf8}
.subh{display:flex;align-items:center;gap:8px;font-weight:800}
.subh span{flex:1}
.del{border:0;background:none;color:var(--r);font-weight:700;min-height:40px;padding:0 8px}
.add{width:100%;min-height:48px;border:1.5px dashed #aaa;border-radius:12px;background:#fff;font-weight:700;margin-top:10px}
.gen{min-height:40px;border:1px solid var(--acc);color:var(--acc);background:#fff;border-radius:10px;padding:0 14px;font-weight:700;margin-top:8px}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.dot.on{box-shadow:0 0 0 3px var(--ink)}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #eee}
.step input[type=checkbox]{width:24px;height:24px;margin-top:2px;flex:none}
.step .num{font-weight:800;min-width:20px}
.step .tx{flex:1}
.step input.v{width:90px;min-height:36px;display:inline-block;margin:0 4px;padding:4px 8px}
.mt{width:100%;border-collapse:collapse;margin-top:8px}
.mt td,.mt th{border:1px solid var(--line);padding:4px;text-align:center}
.mt th{background:#f0f0ec;font-size:13px}
.mt input{min-height:40px;padding:4px 6px;text-align:center;direction:ltr}
.mt .rl input{text-align:right;direction:rtl;font-weight:700}
.unit{min-width:46px;min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;font-weight:700;direction:ltr}
.mhd{display:grid;gap:8px;margin:10px 0 2px}.mhd input{min-height:36px;font-size:14px;text-align:center;font-weight:700;background:#f0f0ec}
.mrow{border-top:1px solid var(--line);padding:8px 0}
.mrl{display:flex;align-items:center;gap:6px}.mrl input{text-align:right;font-weight:800;min-height:40px;font-size:17px}.mrl .del{flex:none}
.mcells{display:grid;gap:8px;margin-top:6px}
.cell{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 4px;align-items:center}.cell input{min-height:44px;text-align:center;direction:ltr;font-size:17px;padding:4px}
.cell .cl{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--mut)}
.phr{display:block;width:100%;text-align:right;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;margin-top:6px;font-size:14px;line-height:1.4}
.phr::before{content:"+ ";color:var(--acc);font-weight:800}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.ph{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.ph img{width:100%;height:120px;object-fit:cover;display:block;background:#ddd}
.ph .c{padding:6px}
.ph input{min-height:38px;font-size:14px;padding:5px 8px}
.ph .bt{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.ph .bt button{flex:1;min-height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;font-weight:700;padding:0 4px}
.ph .bt button.on{background:var(--ink);color:#fff}
.pbtn{display:flex;gap:8px;margin-top:8px}
.pbtn label{flex:1;min-height:46px;border:1.5px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fff;cursor:pointer}
.pbtn input{display:none}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bar button{flex:1;max-width:340px;min-height:52px;border-radius:12px;font-weight:800;font-size:17px;border:2px solid var(--ink);background:#fff}
.bar button.pri{background:var(--ink);color:#fff}
.saved{font-size:12px;color:var(--mut)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;flex-direction:column}
.modal.on{display:flex}
.mbox{background:#fff;margin:auto;width:min(560px,94vw);max-height:90vh;overflow:auto;border-radius:16px;padding:18px}
.mbox h3{margin:0 0 10px}
.mact{display:flex;gap:8px;margin-top:14px}
.mact button{flex:1;min-height:48px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-weight:800}
.mact button.pri{background:var(--ink);color:#fff}
#ann{background:#111}
#ann .tb{display:flex;gap:6px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top));flex-wrap:wrap;background:#1c1c1c;align-items:center}
#ann .tb button{min-height:44px;min-width:44px;border-radius:10px;border:1px solid #444;background:#2a2a2a;color:#fff;font-weight:700;padding:0 10px}
#ann .tb button.on{background:#fff;color:#111}
#ann .cw{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#ann canvas{max-width:100%;max-height:100%;touch-action:none}
#ann .sw{width:34px;height:34px;border-radius:50%;border:2px solid #555;padding:0;min-width:34px!important}
#ann .sw.on{border:3px solid #fff}
#pv{background:#3a3a3a}
#pv .tb{display:flex;gap:8px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));background:#222}
#pv .tb button{flex:1;min-height:48px;border-radius:10px;border:0;font-weight:800;font-size:16px}
#pv .tb .pri{background:var(--y);color:#111}
#pv .pages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
#pv .pages img{width:100%;max-width:600px;box-shadow:0 4px 20px rgba(0,0,0,.4);background:#fff}
#pv .msg{color:#fff;text-align:center;padding:40px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:22px;z-index:60;font-weight:600;display:none;max-width:90vw;text-align:center}
/* ---------- report page (A4 @ 96dpi) ---------- */
#stage{position:fixed;left:-20000px;top:0}
.pg{width:794px;height:1123px;background:#fff;position:relative;font-family:Arial,"Assistant",sans-serif;color:#000;direction:rtl;overflow:hidden}
.pg .lg{position:absolute;top:34px;left:0;right:0;text-align:center}
.pg .lg img{width:300px}
.pg .ft{position:absolute;bottom:26px;left:50px;right:50px}
.pg .ft img{width:100%}
.pg .sg{position:absolute;bottom:62px;left:46px;width:210px}
.pg .ct{position:absolute;top:150px;left:76px;right:76px;font-size:15px;line-height:1.55}
.ct .hd{display:flex;justify-content:space-between;margin-bottom:26px}
.ct .ttl{text-align:center;font-weight:700;font-size:16.5px;margin:0 0 22px}
.ct .ttl span{border-bottom:1.5px solid #000;padding-bottom:1px}
.ct .s{margin-bottom:16px}
.ct .h{display:inline-block;border-bottom:1.3px solid #000;margin-bottom:5px}
.ct p{margin:0 0 4px}
.ct ol{margin:0;padding-inline-start:22px}
.ct li{margin-bottom:3px}
.ct .pt{display:flex;gap:7px;align-items:baseline;margin-bottom:3px}
.ct .pd{width:11px;height:11px;border-radius:50%;flex:none;border:1px solid #555;position:relative;top:1px}
.ct .bl{display:flex;gap:8px}
.rt{border-collapse:collapse;margin:6px 0 6px;font-size:14px}
.rt td,.rt th{border:1px solid #000;padding:3px 12px;text-align:center}
.rt th{font-weight:700;background:#f2f2f2}
.rt td.l{text-align:right;font-weight:600}
.rt td.v{direction:ltr}
.pr{display:flex;gap:18px;margin-bottom:16px;justify-content:center}
.pr figure{margin:0;text-align:center}
.pr figcaption{font-weight:700;font-size:15px;margin-bottom:6px;display:flex;gap:6px;align-items:center;justify-content:center}
.pr img{display:block;margin:0 auto;object-fit:contain}
</style>
</head>

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
let idb=null;const mem={};
function openDB(){return new Promise(res=>{try{const q=indexedDB.open('hameater-short',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{idb=q.result;res()};q.onerror=()=>res()}catch(e){res()}})}
function kvGet(k){return new Promise(res=>{if(!idb)return res(mem[k]);try{const r=idb.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(mem[k])}catch(e){res(mem[k])}})}
function kvSet(k,v){mem[k]=v;return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function kvDel(k){delete mem[k];return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}

cables:[newCable()],genText:'',faults:[{kinds:[],ph:[],note:''}],faultText:'',tables:[],steps:[],extraSteps:[],
result:'',points:[],findNote:'',concTitle:'מסקנות',conc:'',gphotos:[]}}
const cName=i=>R.cables.length>1?'כבל '+(i+1):'הכבל';
function fmtDate(d){if(!d)return'';const[y,m,dd]=d.split('-');return dd+'.'+m+'.'+y.slice(2)}
function genGeneral(){
  const one=c=>{let s='כבל '+(c.type||'');if(c.sec)s+=' בחתך '+c.sec;if(c.mat)s+=' '+c.mat;if(c.from)s+=', מ'+c.from;if(c.to)s+=(c.from?' עד ':', עד ')+c.to;if(c.len)s+=', באורך משוער של כ-'+c.len+' מ\'';return s.replace(/\s+/g,' ').trim()+'.'};
  if(R.cables.length===1)return one(R.cables[0]);
  return R.cables.map((c,i)=>'כבל '+(i+1)+' – '+one(c)).join('\n');
}
function faultLine(f){
  if(!f.kinds.length&&!f.ph.length)return f.note||'';
  let s=f.kinds.join(' ו')||'קצר';const P=PH();
  if(f.ph.includes('all'))s+=' בכל הגידים';
  else{const ph=f.ph.filter(p=>p!==P[3]),z=f.ph.includes(P[3]);
    if(ph.length)s+=(ph.length>1?' בפאזות ':' בפאזה ')+ph.join(', ');
    if(z)s+=ph.length?' ובאפס':' באפס';}
  if(f.note)s+=', '+f.note;return s;
}
function genFault(){if(R.cables.length===1)return faultLine(R.faults[0]);return R.faults.map((f,i)=>'כבל '+(i+1)+' – '+faultLine(f)).join('\n')}
function syncFaults(){while(R.faults.length<R.cables.length)R.faults.push({kinds:[],ph:[],note:''});R.faults.length=R.cables.length}
function autoResult(){const n=R.points.length;return n===0?'לא נמצאה נקודת פגיעה.':n===1?'נמצאה נקודת פגיעה אחת.':'נמצאו '+n+' נקודות פגיעה.'}
function capFor(pi){const p=R.points[pi];let s='נקודת פגיעה '+(ORD[pi]||(pi+1));if(R.cables.length>1&&p.cable!=='')s+=' – כבל '+(+p.cable+1);return s}

function chip(name,v){const[n,i]=name.split(':');const ix=+i;

  if(n==='ctype')R.cables[ix].type=v;
  if(n==='cmat')R.cables[ix].mat=v;
  if(n==='fk')tog(R.faults[ix].kinds,v);
  if(n==='fp'){const f=R.faults[ix];if(v==='all')f.ph=f.ph.includes('all')?[]:['all'];else{f.ph=f.ph.filter(x=>x!=='all');tog(f.ph,v)}const P=PH();f.ph.sort((a,b)=>P.indexOf(a)-P.indexOf(b))}
  if(n==='tv')R.tables[ix].v=v;
  if(n==='tm'){const t=R.tables[ix];t.m=v;t.cols=v==='one'?['']:v==='ba'?['לפני','אחרי']:R.cables.map((c,i)=>'כבל '+(i+1));t.cells={}}
  if(n==='tp')R.tables[ix].place=v;
  if(n==='result')R.result=v;
  if(n==='concTitle')R.concTitle=v;
  if(n==='pc')R.points[ix].cable=v;
  if(n==='ps')R.points[ix].status=R.points[ix].status===v?'':v;
}
function confirmDlg(msg,ok){$('#dlgBox').innerHTML=`<h3>${esc(msg)}</h3><div class="mact"><button id="dNo">ביטול</button><button class="pri" id="dYes">כן</button></div>`;$('#dlg').classList.add('on');$('#dNo').onclick=()=>$('#dlg').classList.remove('on');$('#dYes').onclick=()=>{$('#dlg').classList.remove('on');ok()}}

/* ---------- settings ---------- */
function settings(){
  $('#dlgBox').innerHTML=`<h3>הגדרות</h3>
  <label class="f">סימון פאזות</label><div class="chips"><button class="chip${S.phase==='RST'?' on':''}" id="sR">R / S / T / 0</button><button class="chip${S.phase==='L'?' on':''}" id="sL">L1 / L2 / L3 / N</button></div>
  <label class="f">שלבי בדיקה קבועים (שורה לכל שלב, ___ = שדה למילוי)</label><textarea id="sSteps" style="min-height:140px">${esc(S.steps.join('\n'))}</textarea>
  <label class="f">משפטים מוכנים (שורה לכל משפט)</label><textarea id="sPhr" style="min-height:180px">${esc(S.phrases.join('\n'))}</textarea>
  <label class="f">רשימת חתכים (מופרדים בפסיק)</label><textarea id="sSec" style="direction:ltr">${esc(S.sections.join(', '))}</textarea>
  <div class="mact"><button id="sNo">ביטול</button><button class="pri" id="sOk">שמור</button></div>`;
  $('#dlg').classList.add('on');let ph=S.phase;
  $('#sR').onclick=()=>{ph='RST';$('#sR').classList.add('on');$('#sL').classList.remove('on')};
  $('#sL').onclick=()=>{ph='L';$('#sL').classList.add('on');$('#sR').classList.remove('on')};
  $('#sNo').onclick=()=>$('#dlg').classList.remove('on');
  $('#sOk').onclick=async()=>{const ns=$('#sSteps').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(R){const mapOld=S.steps;R.steps=R.steps.map(k=>{if(k[0]!=='d')return k;const j=ns.indexOf(mapOld[+k.slice(1)]);return j<0?null:'d'+j}).filter(Boolean)}
    S.phase=ph;S.steps=ns;S.phrases=$('#sPhr').value.split('\n').map(s=>s.trim()).filter(Boolean);S.sections=$('#sSec').value.split(',').map(s=>s.trim()).filter(Boolean);
    await kvSet('settings',S);$('#dlg').classList.remove('on');if(R){dirty();rer()}toast('ההגדרות נשמרו')};
}

/* ---------- images ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function shrink(file,max,q){const url=URL.createObjectURL(file);try{const im=await loadImg(url);const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}finally{URL.revokeObjectURL(url)}}
function drawShapes(ctx,W,H,shapes){
  for(const s of shapes){const lw=Math.max(3,W*.009);ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=lw*.8;
    if(s.t==='arrow'){const x1=s.a[0]*W,y1=s.a[1]*H,x2=s.b[0]*W,y2=s.b[1]*H,an=Math.atan2(y2-y1,x2-x1),hl=lw*5;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(an)*hl*.6,y2-Math.sin(an)*hl*.6);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(an-.42),y2-hl*Math.sin(an-.42));ctx.lineTo(x2-hl*Math.cos(an+.42),y2-hl*Math.sin(an+.42));ctx.closePath();ctx.fill()}
    else if(s.t==='circle'){const cx=(s.a[0]+s.b[0])/2*W,cy=(s.a[1]+s.b[1])/2*H,rx=Math.abs(s.b[0]-s.a[0])/2*W,ry=Math.abs(s.b[1]-s.a[1])/2*H;ctx.beginPath();ctx.ellipse(cx,cy,Math.max(rx,4),Math.max(ry,4),0,0,Math.PI*2);ctx.stroke()}
    else if(s.t==='text'){const fs=Math.max(18,W*.045);ctx.font=`bold ${fs}px Arial,Assistant,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';ctx.lineWidth=fs*.18;ctx.strokeStyle=s.c==='#111111'?'#fff':'#000';ctx.shadowBlur=0;ctx.strokeText(s.s,s.a[0]*W,s.a[1]*H);ctx.fillText(s.s,s.a[0]*W,s.a[1]*H)}
    ctx.shadowBlur=0}
}
async function composed(ph){if(!ph.shapes||!ph.shapes.length)return ph.src;const im=await loadImg(ph.src);const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);drawShapes(x,c.width,c.height,ph.shapes);return c.toDataURL('image/jpeg',.9)}
/* annotation editor */
let A=null;
async function annotate(key,i){const ph=arrOf(key)[i];const im=await loadImg(ph.src);const pi=key==='g'?-1:+key.slice(1);
  A={key,i,ph,im,shapes:JSON.parse(JSON.stringify(ph.shapes||[])),tool:'arrow',color:pi>=0?R.points[pi].color:'#d6262e',cur:null};
  if(A.color==='#ffffff'&&pi<0)A.color='#d6262e';
  $('#sws').innerHTML=COLORS.slice(0,6).map(([n,c])=>`<button class="sw${c===A.color?' on':''}" style="background:${c}" data-sw="${c}" aria-label="${n}"></button>`).join('');
  document.querySelectorAll('#ann [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==='arrow'));
  $('#ann').classList.add('on');requestAnimationFrame(aFit)}
function aFit(){const cv=$('#acv'),w=$('#acw');const s=Math.min(w.clientWidth/A.im.naturalWidth,w.clientHeight/A.im.naturalHeight);cv.width=A.im.naturalWidth;cv.height=A.im.naturalHeight;cv.style.width=A.im.naturalWidth*s+'px';cv.style.height=A.im.naturalHeight*s+'px';aDraw()}
function aDraw(){const cv=$('#acv'),x=cv.getContext('2d');x.drawImage(A.im,0,0);drawShapes(x,cv.width,cv.height,A.cur?A.shapes.concat([A.cur]):A.shapes)}
function aPt(e){const r=$('#acv').getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
$('#acv').addEventListener('pointerdown',e=>{if(!A)return;e.preventDefault();const p=aPt(e);
  if(A.tool==='text'){textDlg(p);return}
  $('#acv').setPointerCapture(e.pointerId);A.cur={t:A.tool,c:A.color,a:p,b:p};aDraw()});
$('#acv').addEventListener('pointermove',e=>{if(!A||!A.cur)return;A.cur.b=aPt(e);aDraw()});
$('#acv').addEventListener('pointerup',e=>{if(!A||!A.cur)return;const c=A.cur;A.cur=null;if(Math.hypot(c.b[0]-c.a[0],c.b[1]-c.a[1])>.015)A.shapes.push(c);aDraw()});
function textDlg(p){$('#dlgBox').innerHTML=`<h3>טקסט על התמונה</h3><input id="tIn" placeholder="למשל: נקודת פגיעה"><div class="mact"><button id="tNo">ביטול</button><button class="pri" id="tOk">הוסף</button></div>`;$('#dlg').classList.add('on');setTimeout(()=>$('#tIn').focus(),50);
  $('#tNo').onclick=()=>$('#dlg').classList.remove('on');$('#tOk').onclick=()=>{const v=$('#tIn').value.trim();$('#dlg').classList.remove('on');if(v){A.shapes.push({t:'text',c:A.color,a:p,s:v});aDraw()}}}
$('#ann').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!A)return;
  if(b.dataset.t){A.tool=b.dataset.t;document.querySelectorAll('#ann [data-t]').forEach(x=>x.classList.toggle('on',x===b))}
  if(b.dataset.sw){A.color=b.dataset.sw;document.querySelectorAll('#ann .sw').forEach(x=>x.classList.toggle('on',x===b))}
  if(b.id==='aUndo'){A.shapes.pop();aDraw()}
  if(b.id==='aClr'){A.shapes=[];aDraw()}
  if(b.id==='aCancel'){$('#ann').classList.remove('on');A=null}
  if(b.id==='aSave'){A.ph.shapes=A.shapes;const c=document.createElement('canvas');const s=360/Math.max(A.im.naturalWidth,A.im.naturalHeight);c.width=A.im.naturalWidth*s;c.height=A.im.naturalHeight*s;const x=c.getContext('2d');x.drawImage(A.im,0,0,c.width,c.height);drawShapes(x,c.width,c.height,A.shapes);A.ph.thumb=c.toDataURL('image/jpeg',.7);$('#ann').classList.remove('on');A=null;dirty();rer()}
});
addEventListener('resize',()=>{if(A)aFit()});

/* ---------- report rendering ---------- */
const CT_TOP=150,CT_BOTTOM=1123-150;
function pageShell(){const p=document.createElement('div');p.className='pg';p.innerHTML=`<div class="lg"><img src="${LOGO}"></div><div class="ct"></div><img class="sg" src="${SIG}"><div class="ft"><img src="${FOOT}"></div>`;return p}
const paras=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>/^[-–•]\s*/.test(s)?`<div class="bl"><span>-</span><span>${esc(s.replace(/^[-–•]\s*/,''))}</span></div>`:`<p>${esc(s)}</p>`).join('');
function tableHTML(t){const V=t.v==='x'?t.vx:t.v;const intro=t.intro||('בוצעה בדיקת התנגדות ב-'+(V||'___')+' וולט בין הגידים לאדמה, להלן התוצאות שהתקבלו:');
  const head=t.m==='one'?'':`<tr><th></th>${t.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`;
  const body=t.rows.map((r,ri)=>`<tr><td class="l">${esc(r)}</td>${t.cols.map((c,ci)=>{const v=t.cells[ri+'|'+ci];return`<td class="v">${v&&v.v!==''?esc(v.v)+' '+v.u:''}</td>`}).join('')}</tr>`).join('');
  return`<p>${esc(intro)}</p><table class="rt">${head}${body}</table>`}
function stepTexts(){const all={};S.steps.forEach((s,i)=>all['d'+i]=s);R.extraSteps.forEach((s,i)=>all['x'+i]=s);const v=R.stepVals||{};return R.steps.filter(k=>all[k]).map(k=>all[k].replace('___',v[k]||'___'))}
function blocks(){const B=[];const multi=R.cables.length>1;
  B.push(`<div class="hd"><span>לכבוד: ${esc(R.to)}</span><span>${fmtDate(R.date)}</span></div><div class="ttl"><span>${esc(R.title)}</span></div>`);
  const S_=(h,b)=>b&&B.push(`<div class="s"><div class="h">${h}:</div>${b}</div>`);
  S_('מיקום התקלה',R.loc?`<p>${esc(R.loc)}</p>`:'');
  S_('תיאור כללי',paras(R.genText||genGeneral()));
  const ft=R.tables.filter(t=>t.place==='fault').map(tableHTML).join('');
  S_('תיאור התקלה',paras(R.faultText||genFault())+ft);
  const steps=stepTexts();S_('פירוט הבדיקה',steps.length?steps.map((s,i)=>`<div class="bl"><span style="min-width:16px">${i+1}.</span><span>${esc(s)}</span></div>`).join(''):'');
  const pts=R.points.map((p,i)=>{let s=(i+1)+' – ';if(multi&&p.cable!=='')s+='כבל '+(+p.cable+1)+' – ';s+=p.loc||'';const st=STAT.find(x=>x[0]===p.status);if(st&&p.status)s+=' – '+st[1];return`<div class="pt"><span class="pd" style="background:${p.color}"></span><span>${esc(s)}</span></div>`}).join('');
  const fdt=R.tables.filter(t=>t.place==='find').map(tableHTML).join('');
  S_('ממצאים',`<p>${esc(resultText())}</p>${pts}${paras(R.findNote)}${fdt}`);
  S_(R.concTitle||'מסקנות',paras(R.conc));
  return B}
function photoRows(){const all=[];R.points.forEach((p,pi)=>p.photos.forEach((ph,i)=>all.push({ph,cap:capText('p'+pi,i),col:p.color})));R.gphotos.forEach((ph,i)=>all.push({ph,cap:capText('g',i),col:null}));
  const rows=[];let pend=null;for(const x of all){if(x.ph.size==='full'){if(pend){rows.push([pend]);pend=null}rows.push([x])}else if(pend){rows.push([pend,x]);pend=null}else pend=x}if(pend)rows.push([pend]);return rows}
async function buildPages(){const stage=$('#stage');stage.innerHTML='';const pages=[];const maxH=CT_BOTTOM-CT_TOP;
  let pg=pageShell();stage.appendChild(pg);pages.push(pg);let ct=pg.querySelector('.ct');
  const place=html=>{const w=document.createElement('div');w.innerHTML=html;ct.appendChild(w);if(ct.scrollHeight>maxH&&ct.children.length>1){ct.removeChild(w);pg=pageShell();stage.appendChild(pg);pages.push(pg);ct=pg.querySelector('.ct');ct.appendChild(w)}};
  for(const b of blocks())place(b);
  const rows=photoRows();
  if(rows.length){pg=pageShell();stage.appendChild(pg);pages.push(pg);ct=pg.querySelector('.ct');
    for(const r of rows){const half=r.length>1||r[0].ph.size!=='full';const W=half?300:600,H=half?380:560;let h='<div class="pr">';
      for(const x of r){const src=await composed(x.ph);const im=await loadImg(src);const s=Math.min(W/im.naturalWidth,H/im.naturalHeight);
        h+=`<figure>${x.cap?`<figcaption>${x.col?`<span class="pd" style="background:${x.col};width:12px;height:12px;border-radius:50%;border:1px solid #555;display:inline-block"></span>`:''}${esc(x.cap)}</figcaption>`:''}<img src="${src}" style="width:${Math.round(im.naturalWidth*s)}px;height:${Math.round(im.naturalHeight*s)}px"></figure>`}
      place(h+'</div>')}}
  return pages}
let busy=false;
async function render(){if(document.fonts&&document.fonts.ready)await document.fonts.ready;const pages=await buildPages();await Promise.all([...$('#stage').querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  const out=[];for(const p of pages){out.push(await html2canvas(p,{scale:2,backgroundColor:'#fff',useCORS:true,logging:false}))}$('#stage').innerHTML='';return out}
function fname(){return('דוח איתור קצר - '+(R.loc||'ללא מיקום')+' - '+fmtDate(R.date).replace(/\./g,'')).replace(/[\\/:*?"<>|]/g,'')+'.pdf'}
let lastCanvases=null;
async function preview(dl){if(busy)return;busy=true;await saveNow();$('#pvPages').innerHTML='<div class="msg">מכין את הדוח…</div>';$('#pv').classList.add('on');
  try{lastCanvases=await render();$('#pvPages').innerHTML='';lastCanvases.forEach(c=>{const i=new Image();i.src=c.toDataURL('image/jpeg',.8);$('#pvPages').appendChild(i)});if(dl)await download()}
  catch(err){console.error(err);$('#pvPages').innerHTML='<div class="msg">שגיאה ביצירת הדוח: '+esc(err.message||err)+'</div>'}
  busy=false}
async function download(){if(!lastCanvases)return;
  if(!window.jspdf){toast('ספריית ה־PDF לא נטענה – בדוק חיבור לאינטרנט');return}
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
  lastCanvases.forEach((c,i)=>{if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.88),'JPEG',0,0,210,297)});
  const blob=pdf.output('blob');const name=fname();
  try{const file=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  let dl=null;try{dl=window.claude&&await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),4000))])}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});toast('הדוח נשמר')}catch(e){if(e&&e.code==='declined')toast('ההורדה בוטלה');else toast('ההורדה לא זמינה כאן ('+(e&&e.code||'שגיאה')+')')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('הדוח הורד')}catch(e){toast('ההורדה לא זמינה כאן')}}
$('#pvClose').onclick=()=>$('#pv').classList.remove('on');
$('#pvDl').onclick=async()=>{if(busy)return;busy=true;try{await download()}finally{busy=false}};

/* ---------- boot ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{await openDB();const s=await kvGet('settings');if(s)S={...S,...s};list=(await kvGet('list'))||[];home()})();
}
